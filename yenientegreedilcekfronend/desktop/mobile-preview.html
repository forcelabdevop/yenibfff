<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Betssen mobile preview</title>
 <style>
  *{box-sizing:border-box}body{margin:0;background:#1b1b1b;color:#ddd;font:14px system-ui,sans-serif}
  header{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;flex-wrap:wrap}
  button,a{font:inherit;color:inherit;background:#292929;border:1px solid #555;border-radius:6px;padding:6px 10px;text-decoration:none;cursor:pointer}
  button[aria-pressed=true]{border-color:#edb853;color:#edb853}h1{font-size:14px;font-weight:500;margin:0}
  iframe{display:block;border:0;width:390px;max-width:100%;height:844px;margin:0 auto;background:#000}
 </style>
</head>
<body>
 <header><h1>Mobile preview</h1><button data-width="360" aria-pressed="false">360</button><button data-width="390" aria-pressed="true">390</button><button data-width="430" aria-pressed="false">430</button><a id="standalone" target="_blank" rel="noopener">Open separately</a></header>
 <iframe title="Original mobile frontend" allow="fullscreen; autoplay"></iframe>
 <script>
  const url=new URL('/en/','__LOCAL_MOBILE_ORIGIN__');
  const frame=document.querySelector('iframe');frame.src=url.href;document.querySelector('#standalone').href=url.href;
  document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{
   document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
   frame.style.width=button.dataset.width+'px';
  }));
 </script>
</body>
</html>
