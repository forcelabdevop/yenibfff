<!--
  BetFury'nin (betfury.is) sayfa yuklenirken gosterdigi preloader'in
  tarayicidan cikarilan kodu. Bu bir gorsel dosya (gif/video) DEGIL --
  inline SVG logo + CSS animasyonu.

  ONEMLI: Bu SVG, BetFury markasina ait tescilli logo. Bu dosyayi
  sadece "nasil calisiyor" ogrenmek / referans almak icin kullan.
  Kendi sitende kullanacaksan logoyu kendi markanla degistir.
-->
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>BetFury Preloader - cikarilmis kod</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; }

  body.preloader-active {
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
  }

  .preloader {
    content-visibility: auto;
    background-color: #000;
    position: fixed;
    z-index: 9999;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .preloader.hidden { display: none; }

  /* Logo, opacity 0.4 <-> 1 arasinda sonsuz "nefes alma" animasyonu yapiyor */
  .preloader svg {
    opacity: 0;
    user-select: none;
    width: 100%;
    max-width: 320px;
    height: auto;
    animation: fadein 1.5s ease-in 0s infinite alternate;
    will-change: opacity;
  }

  @keyframes fadein {
    0%   { opacity: 0.4; }
    100% { opacity: 1; }
  }

  /* Ust kisimda kayan kirmizi ilerleme cubugu.
     --translateX degeri JS ile -100% -> 0% arasi degistirilerek
     "yukleniyor" hissi veriliyor. */
  .preloader-progress {
    --translateX: -100%;
    position: absolute;
    top: 0;
    left: 0;
    transform: translateX(var(--translateX));
    transition: transform 0.5s ease-in-out;
    height: 8px;
    width: 105vw;
    background-color: #ED1D49;
    border-radius: 0 8px 8px 0;
    will-change: transform;
  }

  /* --- sadece demo amacli --- */
  .demo-controls {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 10000;
    display: flex;
    gap: 8px;
    font-family: system-ui, sans-serif;
  }
  .demo-controls button {
    background: #ED1D49;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
</style>
</head>

  <div class="demo-controls">
    <button id="btnProgress">Ilerleme cubugunu doldur</button>
    <button id="btnHide">Preloader'i gizle</button>
  </div>

  <script>
    // Orijinal siteye benzer sekilde --translateX degeri JS ile guncelleniyor
    document.getElementById("btnProgress").addEventListener("click", () => {
      document.getElementById("preloadProgress").style.setProperty("--translateX", "0%");
    });
    document.getElementById("btnHide").addEventListener("click", () => {
      document.getElementById("preloader").classList.add("hidden");
      document.body.classList.remove("preloader-active");
    });
  </script>
