<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>__APP_PROJECT_ID_HTML__ | Backoffice Forcelab | __APP_WEBSITE_NAME_HTML__</title>
		<link rel="stylesheet" type="text/css" href="/loader.css" />
	</head>

	<body>
		<div id="app">
			<div id="loading-bg">
				<div class="loading-logo">
					<!-- SVG Logo -->
					<svg
						width="72"
						height="72"
						viewBox="0 0 150 150"
						fill="none"
						xmlns="http://www.w3.org/2000/svg"
					>
						<defs>
							<linearGradient
								id="forcelab-loader-gradient-1"
								x1="87.93"
								y1="90.2"
								x2="57.79"
								y2="90.2"
								gradientTransform="matrix(1, 0, 0, -1, 0, 152)"
								gradientUnits="userSpaceOnUse"
							>
								<stop offset="0" stop-color="#0050ff" />
								<stop offset="1" stop-color="#053ba8" />
							</linearGradient>
							<linearGradient
								id="forcelab-loader-gradient-2"
								x1="59.89"
								y1="72.68"
								x2="92.43"
								y2="33.18"
								gradientTransform="matrix(1, 0, 0, -1, 0, 152)"
								gradientUnits="userSpaceOnUse"
							>
								<stop offset="0" stop-color="#0050ff" />
								<stop offset="1" stop-color="#053ba8" />
							</linearGradient>
						</defs>
						<path
							d="M77.71,47h0c-13.49.09-31,10.38-14,29.69L96,76.5a16.52,16.52,0,0,0,14.23-8.26L122.53,47H77.71Z"
							fill="url(#forcelab-loader-gradient-1)"
						/>
						<path
							d="M71.82,47c-26.45,0-43,28.63-29.75,51.54l25.35,43.93,12.34-21.37a16.54,16.54,0,0,0,0-16.49l-16-27.9a34.66,34.66,0,0,1-3.06-6.83C56,54.77,68.05,47,77.71,47Z"
							fill="url(#forcelab-loader-gradient-2)"
						/>
						<path
							d="M36,12a16.53,16.53,0,0,0-14.31,8.26L9.29,41.71H116a16.52,16.52,0,0,0,14.31-8.27L142.71,12H36Z"
							fill="#0050ff"
						/>
					</svg>
				</div>
				<div class="loading">
					<div class="effect-1 effects"></div>
					<div class="effect-2 effects"></div>
					<div class="effect-3 effects"></div>
				</div>
			</div>
		</div>
		<script type="module" src="/src/main.js"></script>
		<script>
			const websiteName = "__APP_WEBSITE_NAME_JSON__";
			const storedBg = localStorage.getItem(
				`${websiteName}-initial-loader-bg`,
			);

			// Ignore any stored light background so the loader never flashes white
			// before the app boots. Anything near-white falls back to the dark shell.
			const isLightBg = (color) => {
				const hex = /^#([\da-f]{6})$/i.exec((color || "").trim());
				if (!hex) return false;

				const int = parseInt(hex[1], 16);

				return (int >> 16) + ((int >> 8) & 255) + (int & 255) > 600;
			};

			const loaderColor =
				!storedBg || isLightBg(storedBg) ? "#0D0D12" : storedBg;
			const primaryColor =
				localStorage.getItem(
					`${websiteName}-initial-loader-color`,
				) || "#0050FF";

			if (loaderColor)
				document.documentElement.style.setProperty(
					"--initial-loader-bg",
					loaderColor,
				);

			if (primaryColor)
				document.documentElement.style.setProperty(
					"--initial-loader-color",
					primaryColor,
				);
		</script>
	</body>
</html>
